[package]
name = "gmmk-config"
version = "0.2.0"
edition = "2021"
description = "Stock-firmware configuration for GMMK 2 96% US (lightweight native UI)"
license = "MIT"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
hidapi = { version = "2.6", features = ["macos-shared-device"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rfd = "0.15"
directories = "5"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
